; Footer = status/error line. If Calendar.lua never runs, this red message stays
; visible; the script replaces it with the hint on success.
[Footer]
Meter=String
X=20
Y=458
W=304
H=14
FontFace=#FontFace#
FontSize=8
FontColor=#ErrorColor#
AntiAlias=1
ClipString=1
Text=ERROR: Calendar.lua is not running. See the Rainmeter log.

; In-skin editor, placed over the day heading. Enter runs Command1, Esc cancels.
; The script sets DefaultValue (the day's current text) before opening it.
[InputEvent]
Measure=Plugin
Plugin=InputText
X=20
Y=328
W=304
H=22
FontFace=#FontFace#
FontSize=10
FontColor=232,235,241
SolidColor=32,39,51,255
FocusDismiss=1
UnFocusDismiss=1
DefaultValue=
Command1=[!SetVariable EditValue "$UserInput$"][!CommandMeasure CalendarScript "SaveEvent()"]
