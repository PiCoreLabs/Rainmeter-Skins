[Rainmeter]
; Update is in MILLISECONDS (1000 = once per second).
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Month Calendar
Information=Monthly calendar, Monday first. Click a day to see it, click the panel below to edit. Data: @Resources\Events.txt
Version=4.0

[Variables]
FontFace=Segoe UI
TextColor=232,235,241
MutedColor=125,136,151
ErrorColor=255,110,110
Accent=110,190,255
EditValue=

; Script: Initialize() and Update() are called by Rainmeter itself.
[CalendarScript]
Measure=Script
ScriptFile=#@#Calendar.lua

[Background]
Meter=Shape
Shape=Rectangle 0,0,340,480,14 | Fill Color 19,22,29,248 | StrokeWidth 1 | Stroke Color 58,66,80,255

; ---------------- header ----------------
[MonthTitle]
Meter=String
X=20
Y=13
W=200
H=26
FontFace=#FontFace#
FontSize=16
FontWeight=700
FontColor=255,255,255
AntiAlias=1
ClipString=1
Text=Loading...

[PrevMonth]
Meter=String
X=224
Y=14
W=22
H=22
FontFace=#FontFace#
FontSize=14
FontWeight=700
FontColor=#Accent#
AntiAlias=1
Text=<
LeftMouseUpAction=[!CommandMeasure CalendarScript "PrevMonth()"]

[NextMonth]
Meter=String
X=250
Y=14
W=22
H=22
FontFace=#FontFace#
FontSize=14
FontWeight=700
FontColor=#Accent#
AntiAlias=1
Text=>
LeftMouseUpAction=[!CommandMeasure CalendarScript "NextMonth()"]

[TodayButton]
Meter=String
X=276
Y=17
W=48
H=18
FontFace=#FontFace#
FontSize=10
FontColor=#Accent#
AntiAlias=1
Text=TODAY
LeftMouseUpAction=[!CommandMeasure CalendarScript "GoToday()"]

; Next-up line (countdown to the next timed event)
[Countdown]
Meter=String
X=20
Y=42
W=304
H=17
FontFace=#FontFace#
FontSize=10
FontWeight=600
FontColor=#MutedColor#
AntiAlias=1
ClipString=1
Text=-


